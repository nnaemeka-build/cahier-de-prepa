<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cahier de prépa</title>
  <meta name="description" content="A tiny offline to-do notebook for teachers: lesson prep, grading, admin and parent communication.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="sheet">
    <header class="head">
      <div>
        <h1 data-i18n="appTitle"></h1>
        <p class="tagline" data-i18n="tagline"></p>
      </div>
      <button id="lang-toggle" type="button" class="ghost" aria-label="Change language / Changer de langue">EN</button>
    </header>

    <section class="progress" aria-live="polite">
      <div class="bar"><span id="bar-fill"></span></div>
      <p id="progress-text"></p>
    </section>

    <form id="task-form" class="add" autocomplete="off">
      <label class="wide">
        <span data-i18n="titleLabel"></span>
        <input id="title" required maxlength="140" data-i18n-placeholder="titlePlaceholder">
      </label>
      <label>
        <span data-i18n="categoryLabel"></span>
        <select id="category"></select>
      </label>
      <label>
        <span data-i18n="priorityLabel"></span>
        <select id="priority"></select>
      </label>
      <label>
        <span data-i18n="dueLabel"></span>
        <input id="due" type="date">
      </label>
      <button type="submit" class="primary" data-i18n="add"></button>
    </form>

    <section class="filters" aria-label="Filters">
      <select id="filter-category" aria-label="Category"></select>
      <select id="filter-status" aria-label="Status"></select>
      <input id="search" type="search" data-i18n-placeholder="searchPlaceholder" aria-label="Search">
    </section>

    <ul id="task-list" class="tasks"></ul>
    <p id="empty" class="empty" hidden></p>
    <p id="status" class="status" role="status"></p>

    <footer class="tools">
      <div class="tool-group">
        <select id="template-select" aria-label="Template"></select>
        <button id="template-add" type="button" data-i18n="addTemplate"></button>
      </div>
      <div class="tool-group">
        <button id="clear-done" type="button" class="ghost" data-i18n="clearDone"></button>
        <button id="export" type="button" class="ghost" data-i18n="export"></button>
        <label class="ghost file-btn">
          <span data-i18n="import"></span>
          <input id="import" type="file" accept="application/json" hidden>
        </label>
      </div>
    </footer>
  </main>

  <script src="js/i18n.js"></script>
  <script src="js/tasks.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
